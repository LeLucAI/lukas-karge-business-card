<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dr. Lukas Karge</title>
    <meta
      name="description"
      content="Dr. Lukas Karge - AI ecosystems, autonomous systems, entrepreneur."
    />
    <meta property="og:title" content="Dr. Lukas Karge" />
    <meta
      property="og:description"
      content="AI ecosystems. Autonomous systems. Entrepreneur."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/lukas-karge.jpeg" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" href="assets/lukas-karge.jpeg" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f5ef;
        --panel: #ffffff;
        --text: #171717;
        --muted: #5e625f;
        --line: #ded9cd;
        --accent: #145f68;
        --accent-2: #9a5a2f;
        --shadow: 0 24px 70px rgba(30, 28, 24, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--text);
        background:
          linear-gradient(135deg, rgba(20, 95, 104, 0.12), transparent 35%),
          linear-gradient(315deg, rgba(154, 90, 47, 0.14), transparent 38%),
          var(--bg);
      }

      a {
        color: inherit;
      }

      .page {
        width: min(980px, calc(100% - 32px));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        place-items: center;
        padding: 32px 0;
      }

      .card {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(260px, 0.9fr) minmax(0, 1.1fr);
        background: rgba(255, 255, 255, 0.82);
        border: 1px solid rgba(222, 217, 205, 0.9);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .portrait {
        min-height: 620px;
        position: relative;
        background: #ddd6c8;
      }

      .portrait img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .content {
        padding: clamp(28px, 5vw, 56px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
      }

      .identity {
        display: grid;
        gap: 18px;
      }

      .eyebrow {
        margin: 0;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 760;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.55rem, 7vw, 5.4rem);
        line-height: 0.94;
        letter-spacing: 0;
      }

      .roles {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .roles li {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 11px;
        color: var(--muted);
        background: rgba(247, 245, 239, 0.72);
        font-size: 0.95rem;
        line-height: 1;
      }

      .actions,
      .links {
        display: grid;
        gap: 10px;
      }

      .button {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 14px 12px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
        font-size: 1rem;
        font-weight: 680;
        line-height: 1.2;
        transition:
          border-color 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      .button:hover,
      .button:focus-visible {
        border-color: rgba(20, 95, 104, 0.46);
        box-shadow: 0 12px 24px rgba(20, 95, 104, 0.12);
        transform: translateY(-1px);
        outline: none;
      }

      .button.primary {
        background: var(--text);
        color: #fff;
        border-color: var(--text);
      }

      .button span:last-child {
        color: currentColor;
        opacity: 0.58;
        font-size: 1.05rem;
      }

      .section-label {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 760;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .fineprint {
        margin: 0;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.55;
      }

      @media (max-width: 760px) {
        .page {
          width: min(100% - 24px, 520px);
          align-items: start;
        }

        .card {
          grid-template-columns: 1fr;
        }

        .portrait {
          min-height: auto;
          aspect-ratio: 4 / 3;
        }

        .content {
          gap: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <article class="card" aria-label="Business card for Dr. Lukas Karge">
        <figure class="portrait">
          <img src="assets/lukas-karge.jpeg" alt="Portrait of Dr. Lukas Karge" />
        </figure>

        <section class="content">
          <div class="identity">
            <p class="eyebrow">Digital business card</p>
            <h1>Dr. Lukas Karge</h1>
            <ul class="roles" aria-label="Roles">
              <li>AI Ecosystems</li>
              <li>Autonomous Systems</li>
              <li>Entrepreneur</li>
            </ul>
          </div>

          <nav class="actions" aria-label="Primary contact links">
            <a class="button primary" href="https://www.linkedin.com/in/lukas-karge-231903b3/">
              <strong>LinkedIn</strong>
              <span aria-hidden="true">-&gt;</span>
            </a>
            <a class="button" href="mailto:lukas.karge@obsphera.ai">
              <strong>Email</strong>
              <span>lukas.karge@obsphera.ai</span>
            </a>
            <a class="button" href="https://calendly.com/lukaskarge">
              <strong>Schedule Meeting</strong>
              <span aria-hidden="true">-&gt;</span>
            </a>
            <a class="button" href="lukas-karge.vcf" download>
              <strong>Download Contact</strong>
              <span>.vcf</span>
            </a>
          </nav>

          <div>
            <p class="section-label">Projects</p>
            <nav class="links" aria-label="Project links">
              <a class="button" href="https://obsphera.ai">
                <strong>Obsphera.ai</strong>
                <span aria-hidden="true">-&gt;</span>
              </a>
              <a class="button" href="https://pixlbox.io">
                <strong>pixlbox.io</strong>
                <span aria-hidden="true">-&gt;</span>
              </a>
              <a class="button" href="https://www.asg.ed.tum.de/pf/home/">
                <strong>Swarm.ai</strong>
                <span>TUM PF</span>
              </a>
            </nav>
          </div>
        </section>
      </article>
    </main>
  </body>
</html>
